name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - run: mise run test

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bazel: ["8.0.0", "8.8.2", "9.3.2"]
        include:
          - bazel: "8.0.0"
            fixture_versions: rules_kotlin=2.1.0,rules_java=8.6.0,rules_jvm_external=6.6
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      BKL_FIXTURE_VERSIONS: ${{ matrix.fixture_versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel/_bazel_*/cache/repos
            /private/var/tmp/_bazel_*/cache/repos
          key: bazel-repos-${{ runner.os }}-${{ matrix.bazel }}-${{ hashFiles('fixtures/basic/MODULE.bazel') }}
      - run: mise run integration

  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: "9.3.2"
      BKL_PROBE_LOG_DIR: ${{ runner.temp }}/probe-logs
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: .cache/kotlin-lsp
          key: kotlin-lsp-271.2085.0-${{ runner.os }}-${{ runner.arch }}
      - run: mise run probe
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-lsp-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-logs
